  --vh:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  --u:min(calc(100vw / 1080), calc(var(--vh) / 1920));
}
.stage{position:relative;width:calc(1080*var(--u));height:calc(1920*var(--u));background:var(--bg);overflow:hidden;
  display:flex;flex-direction:column;flex:none}

.deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.deco img{position:absolute;display:block}

.check{position:relative;z-index:2;flex:none;height:calc(72*var(--u));width:100%;
  display:grid;grid-auto-flow:column;grid-template-rows:calc(36*var(--u)) calc(36*var(--u));grid-auto-columns:calc(36*var(--u));overflow:hidden}
.check i{display:block;width:calc(36*var(--u));height:calc(36*var(--u))}
.check i.r{background:var(--red)}
.check i.w{background:#FFFFFF}

.inner{position:relative;z-index:1;flex:1;padding:calc(48*var(--u)) calc(70*var(--u)) 0;
  display:flex;flex-direction:column;align-items:center;text-align:center}

.logo{width:calc(340*var(--u));color:var(--ink);--logo-sw:9px;--logo-stroke:#111111}
.logo svg{width:100%;height:auto;display:block}

.eyebrow{margin-top:calc(28*var(--u));font-weight:500;font-size:calc(24*var(--u));letter-spacing:.015em;color:var(--ink-2)}

.head{margin-top:calc(34*var(--u));font-weight:300;font-size:calc(104*var(--u));line-height:1.3;
  letter-spacing:-.035em;color:var(--ink)}
.head .hi{font-style:normal;font-weight:700;color:var(--red);position:relative;letter-spacing:-.022em;padding:0 calc(1*var(--u))}
.head .hi::after{content:"";position:absolute;left:0;right:0;bottom:calc(-2*var(--u));height:calc(7*var(--u));background:var(--red)}

.sub{margin-top:calc(30*var(--u));font-weight:300;font-size:calc(24*var(--u));line-height:1.62;letter-spacing:-.018em;color:var(--ink-2)}
.sub b{font-weight:600;color:var(--ink)}

.qrwrap{margin-top:calc(38*var(--u));display:flex;flex-direction:column;align-items:center}
.plate{width:calc(680*var(--u));height:calc(680*var(--u));background:#FFF;border:calc(1.4*var(--u)) solid rgba(17,17,17,.1);
  display:flex;align-items:center;justify-content:center}
.qr{width:calc(576*var(--u));height:calc(576*var(--u))}
.qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.qrcap{margin-top:calc(26*var(--u));font-weight:500;font-size:calc(23*var(--u));letter-spacing:-.01em;color:var(--ink)}

.steps{margin-top:auto;padding-top:calc(20*var(--u));margin-bottom:calc(32*var(--u));font-weight:400;font-size:calc(21*var(--u));
  letter-spacing:-.015em;color:var(--ink);white-space:nowrap}
.steps b{font-family:'MADE Outer Sans','Pretendard',sans-serif;font-weight:500;font-size:calc(17*var(--u));
  letter-spacing:.1em;color:var(--red);margin-right:calc(5*var(--u))}
.steps .dot{color:var(--ink-3);margin:0 calc(17*var(--u))}

.band{position:relative;z-index:2;flex:none;height:calc(96*var(--u));background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:space-between;padding:0 calc(70*var(--u))}
.band .bl{display:flex;align-items:baseline;gap:calc(16*var(--u))}
.band .cses{font-family:'MADE Outer Sans','Pretendard',sans-serif;font-weight:500;font-size:calc(28*var(--u));letter-spacing:.13em}
.band .ko{font-weight:400;font-size:calc(20*var(--u));letter-spacing:.02em;opacity:.92}
.band .bc{font-weight:300;font-size:calc(20*var(--u));letter-spacing:-.01em;opacity:.95}
.band .brr{font-family:'MADE Outer Sans','Pretendard',sans-serif;font-weight:500;font-size:calc(24*var(--u));letter-spacing:.06em}

html.idle,html.idle body{cursor:none}
#fs{position:fixed;right:16px;top:16px;z-index:10;border:0;cursor:pointer;
  padding:10px 18px;border-radius:999px;background:rgba(17,17,17,.62);color:#fff;
  font-family:inherit;font-size:14px;font-weight:500;letter-spacing:-.01em;
  transition:opacity .4s ease;backdrop-filter:blur(6px)}
#fs.hide{opacity:0;pointer-events:none}
#fs:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#fs{transition:none}}
</style>
</head>

<button id="fs" type="button">전체화면</button>
<script>
(function(){
  var btn=document.getElementById('fs'), t=null;
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
  function enter(){
    var e=document.documentElement,
        r=e.requestFullscreen||e.webkitRequestFullscreen||e.webkitRequestFullScreen||e.mozRequestFullScreen||e.msRequestFullscreen;
    if(!r) return;
    try{var p=r.call(e);if(p&&p.catch)p.catch(function(){});}catch(err){}
  }
  function leave(){
    var d=document, x=d.exitFullscreen||d.webkitExitFullscreen||d.webkitCancelFullScreen||d.msExitFullscreen;
    if(!x) return; try{var p=x.call(d);if(p&&p.catch)p.catch(function(){});}catch(err){}
  }
  function toggle(){ fsEl()?leave():enter(); }
  btn.addEventListener('click',function(ev){ev.stopPropagation();toggle();});
  document.addEventListener('click',toggle);
  document.addEventListener('keydown',function(e){
    if(e.key==='f'||e.key==='F'||e.key==='Enter'){toggle();}
  });
  function label(){ btn.textContent = fsEl() ? '전체화면 종료' : '전체화면'; }
  document.addEventListener('fullscreenchange',label);
  document.addEventListener('webkitfullscreenchange',label);

  function wake(){ btn.classList.remove('hide');
    document.documentElement.classList.remove('idle'); clearTimeout(t);
    t=setTimeout(function(){btn.classList.add('hide');
      document.documentElement.classList.add('idle');},4000); }
  ['mousemove','touchstart','keydown'].forEach(function(n){document.addEventListener(n,wake,{passive:true});});
  wake();

  var lock=null;
  function keepAwake(){
    if(!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(s){lock=s;},function(){});
  }
  keepAwake();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') keepAwake();
  });
})();
</script>
